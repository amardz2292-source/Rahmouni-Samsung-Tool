
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahmouni Samsung Tool</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050914;
  color: white;
  font-family: Arial, sans-serif;
  direction: rtl;
}

.header {
  text-align: center;
  padding: 30px 15px;
  background: linear-gradient(135deg, #101e38, #07101f);
  border-bottom: 2px solid #168bff;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  color: #168bff;
}

.header h1 {
  margin: 10px 0;
  font-size: 24px;
}

.header p {
  color: #9bbce0;
}

.container {
  padding: 20px;
  max-width: 600px;
  margin: auto;
}

.section-title {
  color: #168bff;
  text-align: center;
  margin: 25px 0;
}

.tool {
  display: block;
  width: 100%;
  padding: 18px;
  margin: 12px 0;
  background: #101c31;
  color: white;
  border: 1px solid #1769b5;
  border-radius: 14px;
  font-size: 17px;
  text-align: right;
}

.tool span {
  color: #168bff;
  margin-left: 12px;
}

.tool:active {
  background: #174b80;
}

.footer {
  text-align: center;
  padding: 25px;
  color: #7589a5;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">SAMSUNG</div>
  <h1>Rahmouni Samsung Tool</h1>
  <p>أداة صيانة هواتف Samsung</p>
</div>

<div class="container">
<div style="background:#101c31;padding:18px;border-radius:14px;margin:15px 0;border:1px solid #1769b5;">

<h3 style="color:#168bff;text-align:center;">
معلومات الهاتف
</h3>

<label>اختر موديل Samsung:</label>

<select id="model" style="width:100%;padding:14px;margin-top:12px;background:#07101f;color:white;border:1px solid #168bff;border-radius:10px;">

<option value="">اختر الموديل</option>
<option>Galaxy A12</option>
<option>Galaxy A13</option>
<option>Galaxy A14</option>
<option>Galaxy A15</option>
<option>Galaxy A24</option>
<option>Galaxy A32</option>
<option>Galaxy A52</option>
<option>Galaxy A54</option>
<option>Galaxy S20</option>
<option>Galaxy S21</option>
<option>Galaxy S22</option>
<option>Galaxy S23</option>
<option>Galaxy S24</option>

</select>

<button class="tool" onclick="showModel()">
عرض معلومات الموديل
</button>

<p id="modelInfo" style="color:#9bbce0;text-align:center;"></p>

</div>

<script>
function showModel() {
  let model = document.getElementById("model").value;
  let info = document.getElementById("modelInfo");

  if (model === "") {
    info.innerHTML = "يرجى اختيار موديل الهاتف";
  } else {
    info.innerHTML =
      "الموديل المختار: " + model +
      "<br>يمكنك البحث عن ملف Firmware المناسب لهذا الموديل.";
  }
}
</script>


  <h2 class="section-title">قائمة الأدوات</h2>

  <button class="tool" onclick="alert('USB Flash - قيد التطوير')">
    <span>🔌</span> USB Flash
  </button>

  <button class="tool" onclick="alert('Firmware - قيد التطوير')">
    <span>📦</span> Firmware
  </button>

  <button class="tool" onclick="alert('Samsung Drivers - قيد التطوير')">
    <span>💻</span> Samsung Drivers
  </button>

  <button class="tool" onclick="alert('FRP Recovery - استعادة الحساب الرسمي')">
    <span>🔐</span> FRP Recovery
  </button>

  <button class="tool" onclick="alert('Phone Information - قيد التطوير')">
    <span>📱</span> Phone Information
  </button>

</div>

<div class="footer">
  Rahmouni Hocine © 2026
</div>

<div style="margin:15px;padding:15px;background:#101c31;border-radius:12px;">
  <h3 style="color:#168bff;">أدوات إضافية</h3>

  <button class="tool" onclick="copyModel()">
    📋 نسخ اسم الموديل
  </button>

  <button class="tool" onclick="searchFirmware()">
    🔎 البحث عن Firmware
  </button>

  <button class="tool" onclick="openSamsungSupport()">
    🛠️ دعم Samsung الرسمي
  </button>

  <p id="extraInfo" style="color:#9bbce0;text-align:center;"></p>
</div>

<script>
function copyModel() {
  const model = document.getElementById("model").value;
  const info = document.getElementById("extraInfo");

  if (!model) {
    info.textContent = "اختر موديل الهاتف أولاً";
    return;
  }

  if (navigator.clipboard) {
    navigator.clipboard.writeText(model);
    info.textContent = "تم نسخ الموديل: " + model;
  } else {
    info.textContent = "الموديل المختار: " + model;
  }
}

function searchFirmware() {
  const model = document.getElementById("model").value;

  if (!model) {
    document.getElementById("extraInfo").textContent =
      "اختر موديل الهاتف أولاً";
    return;
  }

  const query = encodeURIComponent(model + " Samsung official firmware");
  window.open("https://www.google.com/search?q=" + query, "_blank");
}

function openSamsungSupport() {
  window.open("https://www.samsung.com/ae/support/", "_blank");
}
</script>

</body>
</html>
